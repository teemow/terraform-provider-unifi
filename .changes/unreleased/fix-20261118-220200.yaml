kind: fix
body: '**`unifi_device`: upgrading a schema version 0 state no longer removes and re-adds every `port_override`, or plans LAG ports as `switch`.** Version 0 read every flag of a declared port from the controller, so its state holds `false` for each one the configuration never mentions. The flags that became nested groups in v0.60.0 upgraded to objects (`lldpmed = { enabled = false, … }`) where the configuration has null, so no element was paired with its block: every plan replaced every override with its computed attributes unknown and the apply ended in `Provider returned invalid result object after apply`. The remaining flat flags made the planned element differ from its block, and the framework then applied `op_mode`''s default over a configured `aggregate`. The version 0 upgrader now drops the `false` flags, as later versions keep an unset flag null; a flag the configuration does set to `false` is planned once as an addition'
time: 2026-11-18T22:02:00Z
