kind: feature
body: '**`unifi_device`: `port_override.lag_idx` names the link aggregation group of an aggregate port.** The controller stores a group number on the lead port of a LAG and needs it back: `port_overrides` is a full-replace array, and an `op_mode = "aggregate"` port written without its `lag_idx` falls back to `switch`, which tears the LAG down (measured on a USW Aggregation, where any change to one port of the switch dropped every LAG on it). go-unifi did not model the field, so it was lost on decode. It is now read, sent when set, and carried from the controller when a declared port leaves it out, like `stp_edge_state`. `unifi_device_port` takes the same attribute. Requires the `lag_idx` field in go-unifi''s `DevicePortOverrides`'
